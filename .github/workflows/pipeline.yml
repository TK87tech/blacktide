name: Detection pipeline

# Monthly: imports SkyTruth Cerulean marine slicks, runs BlackTide's land/creek
# detector for the previous month, commits web/data and redeploys the site.
# Cerulean import works without secrets; land detection + enrichment need:
#   GEE_SERVICE_ACCOUNT_KEY  – JSON key of a service account registered with Earth Engine
#   GEE_PROJECT              – your Earth Engine Cloud project id
on:
  schedule:
    - cron: "0 6 3 * *" # 06:00 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      aoi:
        description: "Area: pilot (Bodo/Ogoniland) or delta (whole region)"
        default: delta
        type: choice
        options: [delta, pilot]
      start:
        description: "Start date YYYY-MM-DD (blank = last month)"
        required: false
      end:
        description: "End date YYYY-MM-DD, exclusive (blank = last month)"
        required: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
    steps:
      - uses: actions/checkout@v5
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ] || [ -z "$GEE_PROJECT" ]; then
            echo "::notice::Earth Engine secrets not set — importing Cerulean only (no land detection, no enrichment)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Import marine detections (SkyTruth Cerulean)
        run: |
          if [ "${{ steps.creds.outputs.ok }}" = "true" ]; then
            python pipeline/scripts/import_cerulean.py
          else
            python pipeline/scripts/import_cerulean.py --no-enrich
          fi
      - name: Detect land & creek spills
        if: steps.creds.outputs.ok == 'true'
        run: |
          ARGS="--aoi ${{ inputs.aoi || 'delta' }}"
          if [ -n "${{ inputs.start }}" ] && [ -n "${{ inputs.end }}" ]; then
            ARGS="$ARGS --start ${{ inputs.start }} --end ${{ inputs.end }}"
          fi
          python pipeline/scripts/detect.py $ARGS
      - name: Commit results
        id: commit
        run: |
          if git diff --quiet -- web/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "blacktide-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/data
            git commit -m "data: detections $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
